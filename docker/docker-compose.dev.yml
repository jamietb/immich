#
# WARNING: To install Immich, follow our guide: https://immich.app/docs/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

# For development see:
# - https://immich.app/docs/developer/setup
# - https://immich.app/docs/developer/troubleshooting

name: immich-dev

services:
  immich-server:
    container_name: immich_server
    command: ['immich-dev']
    image: immich-server-dev:latest
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    user: '${UID:-1000}:${GID:-1000}'
    build:
      context: ../
      dockerfile: server/Dockerfile
      target: dev
    restart: unless-stopped
    volumes:
      - ..:/usr/src/app
      - ${UPLOAD_LOCATION}:/data
      - ${THUMB_LOCATION}:/data/thumbs
      - ${ENCODED_VIDEO_LOCATION}:/data/encoded-video
      - ${PROFILE_LOCATION}:/data/profile
      - ${BACKUP_LOCATION}:/data/backups
      - /mnt/immich-fast/tmp:/tmp
      - /etc/localtime:/etc/localtime:ro
      - /mnt/media/iphone:/mnt/media/iphone
      - /mnt/media/hdd-backups/extreme-ssd-1tb:/mnt/media/hdd-backups/extreme-ssd-1tb
      - /mnt/media/hdd-backups/wd-black-2tb:/mnt/media/hdd-backups/wd-black-2tb
      - /mnt/media/hdd-backups/sharge-1tb:/mnt/media/hdd-backups/sharge-1tb
    env_file:
      - .env
    environment:
      IMMICH_REPOSITORY: immich-app/immich
      IMMICH_REPOSITORY_URL: https://github.com/immich-app/immich
      IMMICH_SOURCE_REF: local
      IMMICH_SOURCE_COMMIT: af2efbdbbddc27cd06142f22253ccbbbbeec1f55
      IMMICH_SOURCE_URL: https://github.com/immich-app/immich/commit/af2efbdbbddc27cd06142f22253ccbbbbeec1f55
      IMMICH_BUILD: '9654404849'
      IMMICH_BUILD_URL: https://github.com/immich-app/immich/actions/runs/9654404849
      IMMICH_BUILD_IMAGE: development
      IMMICH_BUILD_IMAGE_URL: https://github.com/immich-app/immich/pkgs/container/immich-server
      IMMICH_THIRD_PARTY_SOURCE_URL: https://github.com/immich-app/immich/
      IMMICH_THIRD_PARTY_BUG_FEATURE_URL: https://github.com/immich-app/immich/issues
      IMMICH_THIRD_PARTY_DOCUMENTATION_URL: https://immich.app/docs
      IMMICH_THIRD_PARTY_SUPPORT_URL: https://immich.app/docs/community-guides
      IMMICH_WORKERS_INCLUDE: 'api'
      IMMICH_MACHINE_LEARNING_URL: http://immich-ml-balancer:80
      TZ: Europe/London
      TMPDIR: /tmp
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - 9230:9230
      - 9231:9231
      - 2283:2283
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_started
      init:
        condition: service_completed_successfully
    healthcheck:
      disable: false

  immich-microservices:
    container_name: immich_microservices
    command: ['immich-dev']
    image: immich-server-dev:latest
    user: '${UID:-1000}:${GID:-1000}'
    build:
      context: ../
      dockerfile: server/Dockerfile
      target: dev
    restart: unless-stopped
    volumes:
      - ..:/usr/src/app
      - ${UPLOAD_LOCATION}:/data
      - ${THUMB_LOCATION}:/data/thumbs
      - ${ENCODED_VIDEO_LOCATION}:/data/encoded-video
      - ${PROFILE_LOCATION}:/data/profile
      - ${BACKUP_LOCATION}:/data/backups
      - /mnt/immich-fast/tmp:/tmp
      - /etc/localtime:/etc/localtime:ro
      - /mnt/media/iphone:/mnt/media/iphone
      - /mnt/media/hdd-backups/extreme-ssd-1tb:/mnt/media/hdd-backups/extreme-ssd-1tb
      - /mnt/media/hdd-backups/wd-black-2tb:/mnt/media/hdd-backups/wd-black-2tb 
      - /mnt/media/hdd-backups/sharge-1tb:/mnt/media/hdd-backups/sharge-1tb
    env_file:
      - .env
    environment:
      IMMICH_REPOSITORY: immich-app/immich
      IMMICH_REPOSITORY_URL: https://github.com/immich-app/immich
      IMMICH_SOURCE_REF: local
      IMMICH_SOURCE_COMMIT: af2efbdbbddc27cd06142f22253ccbbbbeec1f55
      IMMICH_SOURCE_URL: https://github.com/immich-app/immich/commit/af2efbdbbddc27cd06142f22253ccbbbbeec1f55
      IMMICH_BUILD: '9654404849'
      IMMICH_BUILD_URL: https://github.com/immich-app/immich/actions/runs/9654404849
      IMMICH_BUILD_IMAGE: development
      IMMICH_BUILD_IMAGE_URL: https://github.com/immich-app/immich/pkgs/container/immich-microservices
      IMMICH_THIRD_PARTY_SOURCE_URL: https://github.com/immich-app/immich/
      IMMICH_THIRD_PARTY_BUG_FEATURE_URL: https://github.com/immich-app/immich/issues
      IMMICH_THIRD_PARTY_DOCUMENTATION_URL: https://immich.app/docs
      IMMICH_THIRD_PARTY_SUPPORT_URL: https://immich.app/docs/community-guides
      IMMICH_WORKERS_EXCLUDE: 'api'
      IMMICH_MACHINE_LEARNING_URL: http://immich-ml-balancer:80
      TZ: Europe/London
      TMPDIR: /tmp
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_started
      init:
        condition: service_completed_successfully
    healthcheck:
      disable: false

  power-tools:
    container_name: immich_power_tools
    image: ghcr.io/varun-raj/immich-power-tools:latest
    ports:
      - "8001:3000"
    env_file:
      - .env

  immich-web:
    container_name: immich_web
    image: immich-web-dev:latest
    # Needed for rootless docker setup, see https://github.com/moby/moby/issues/45919
    # user: 0:0
    user: '${UID:-1000}:${GID:-1000}'
    build:
      context: ../
      dockerfile: server/Dockerfile
      target: dev
    command: ['immich-web']
    env_file:
      - .env
    environment:
      VITE_API_URL: http://immich-server:2283
      VITE_WS_URL: ws://immich-server:2283
    ports:
      - 3000:3000
      - 24678:24678
    volumes:
      - ..:/usr/src/app
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    restart: unless-stopped
    depends_on:
      immich-server:
        condition: service_started
      init:
        condition: service_completed_successfully

  immich-ml-balancer:
    container_name: immich_ml_balancer
    image: apetersson/immich_ml_balancer:latest # Your custom balancer image
    environment:
      # Comma-separated list of immich_ml instance hostnames/IPs.
      # Format: "hostname_or_ip[:port]"
      # If port is omitted, it defaults to 3003.
      IMML_BACKENDS: "immich-machine-learning:3003,10.0.10.244:3003,10.0.40.188:3003,10.0.10.103:3003" # Example with local and a
      # No ports mapping needed here, as it's accessed via the internal network by immich server on port 80
      #expose avahi for name resolution on your lan:
    volumes:
      - /var/run/dbus:/var/run/dbus               # DBus system bus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    depends_on:
      - immich-machine-learning # Depend on at least one ML instance for startup order
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: immich-machine-learning-dev:latest
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    build:
      context: ../machine-learning
      dockerfile: Dockerfile
      args:
        - DEVICE=cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    ports:
      - 3003:3003
    volumes:
      - ../machine-learning:/usr/src/app
      - /mnt/immich-fast/ml-cache:/cache
      - /mnt/immich-fast/tmp:/tmp
    env_file:
      - .env
    environment:
      TZ: Europe/London
      TMPDIR: /tmp
    depends_on:
      - database
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:a137a2b60aca1a75130022d6bb96af423fefae4eb55faf395732db3544803280
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    ports:
      - 5432:5432
    shm_size: 128mb
  # set IMMICH_TELEMETRY_INCLUDE=all in .env to enable metrics
  # immich-prometheus:
  #   container_name: immich_prometheus
  #   ports:
  #     - 9090:9090
  #   image: prom/prometheus
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus-data:/prometheus

  # first login uses admin/admin
  # add data source for http://immich-prometheus:9090 to get started
  # immich-grafana:
  #   container_name: immich_grafana
  #   command: ['./run.sh', '-disable-reporting']
  #   ports:
  #     - 3000:3000
  #   image: grafana/grafana:10.3.3-ubuntu
  #   volumes:
  #     - grafana-data:/var/lib/grafana

  init:
    container_name: init
    image: busybox
    env_file:
      - .env
    user: 0:0
    command: sh -c 'for path in /usr/src/app/.pnpm-store /usr/src/app/server/node_modules /usr/src/app/.github/node_modules /usr/src/app/cli/node_modules /usr/src/app/docs/node_modules /usr/src/app/e2e/node_modules /usr/src/app/open-api/typescript-sdk/node_modules /usr/src/app/web/.svelte-kit /usr/src/app/web/coverage /usr/src/app/node_modules /usr/src/app/web/node_modules; do [ -e "$$path" ] && chown -R ${UID:-1000}:${GID:-1000} "$$path" || true; done'

volumes:
  model-cache:
  prometheus-data:
  grafana-data:
